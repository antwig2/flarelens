name: Deploy Website (flarelens.dev)

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'public/install.sh'
      - 'public/install.ps1'
      - 'src/control/fleet.ts'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-site:
    name: Build & Deploy flarelens.dev
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Root Dependencies (Wrangler)
        run: npm ci

      - name: Build Website Bundle
        run: node ./website/scripts/build.mjs

      - name: Deploy Static Assets Worker to flarelens.dev
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: ./website
        run: npx wrangler deploy
