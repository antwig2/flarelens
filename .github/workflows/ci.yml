name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck & D1 Control Plane Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Root Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Run D1 Control Plane & Piggyback Tests
        run: npm test

      - name: Install & Build Nimbus Website (flarelens.dev)
        working-directory: ./website
        run: |
          npm ci
          npm run build
          npx @cloudflare/nimbus-docs check
